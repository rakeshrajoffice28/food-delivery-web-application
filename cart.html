<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="quick dine icon.png" type="image/png" />
  <title>Quick Dine | Cart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="cart">
  <header class="topbar">
    <div class="brand">
      <div class="logo">QD</div>
      <div>
        <h1>Quick Dine</h1>
        <p>Your cart is ready to checkout.</p>
      </div>
    </div>
    <nav class="nav-links">
      <a href="login.html" id="nav-account">👤 Login</a>
      <a href="index.html">Home</a>
      <a href="cart.html" class="active">Cart <span id="cart-badge">0</span></a>
      <button id="nav-logout" class="btn btn-outline nav-logout hidden" type="button">Logout</button>
    </nav>
  </header>

  <main class="cart-main">
    <section class="cart-panel">
      <div class="cart-header">
        <h2>Order Cart</h2>
        <p>Review items, update quantity, and complete your order.</p>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-total-row">
        <span>Total</span>
        <strong id="cart-total">₹0</strong>
      </div>
    </section>

    <section class="checkout-panel">
      <h2>Delivery details</h2>
      <form id="checkout-form" class="checkout-form">
        <label>
          Full Name
          <input id="customer-name" type="text" required />
        </label>
        <label>
          Phone Number
          <input id="customer-phone" type="tel" pattern="[0-9]{10}" placeholder="9876543210" required />
        </label>
        <label>
          Delivery Address
          <textarea id="customer-address" rows="4" required></textarea>
        </label>
        <div class="payment-section">
          <p>Payment option</p>
          <input type="radio" name="payment" value="Cash on Delivery"  class="radio1" checked /><label > Cash on Delivery</label>
          <input type="radio" name="payment" value="Card Payment"  class="radio2" /><label > Card Payment</label>
          <input type="radio" name="payment" value="UPI" class="radio3"/> <label > UPI</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Place Order</button>
        <p class="form-note">You must add name, number and address before placing order.</p>
      </form>
    </section>
  </main>

  <footer class="footer-bar">
    <p>Quick Dine Cart | Smooth checkout experience.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
