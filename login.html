<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="quick dine icon.png" type="image/png" />
  <title>Quick Dine | Login / Sign Up</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <header class="topbar">
    <div class="brand">
      <div class="logo">QD</div>
      <div>
        <h1>Quick Dine</h1>
        <p>Login or sign up to save orders and track your cart.</p>
      </div>
    </div>
    <nav class="nav-links">
      <a href="login.html" id="nav-account" class="active">👤 Login</a>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
      <button id="nav-logout" class="btn btn-outline nav-logout hidden" type="button">Logout</button>
    </nav>
  </header>

  <main class="main-grid">
    <section class="account-card">
      <div class="account-box">
        <h2>Login or Create a New Account</h2>
        <p>Use your email and password to continue faster and save your favorites.</p>
        <div class="auth-tabs">
          <button class="tab-button active" data-target="login-form">Login</button>
          <button class="tab-button" data-target="signup-form">Sign Up</button>
        </div>
        <div class="auth-forms">
          <form id="login-form" class="auth-form active">
            <label>
              Email
              <input id="login-email" type="email" required />
            </label>
            <label>
              Password
              <input id="login-password" type="password" required />
            </label>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
          <form id="signup-form" class="auth-form">
            <label>
              Name
              <input id="signup-name" type="text" required />
            </label>
            <label>
              Email
              <input id="signup-email" type="email" required />
            </label>
            <label>
              Password
              <input id="signup-password" type="password" required />
            </label>
            <button type="submit" class="btn btn-primary">Create Account</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer-bar">
    <p>Quick Dine | Login and account access page.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
